name: Linux Secret Service acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-secret-service:
    name: Linux Secret Service
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Secret Service dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus-daemon \
            dbus-user-session \
            gnome-keyring \
            libsecret-tools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Exercise a temporary DBus session and keyring
        shell: bash
        run: |
          set -euo pipefail

          keyring_home="$(mktemp -d)"
          runtime_dir="$(mktemp -d)"
          cleanup() {
            rm -rf -- "$keyring_home" "$runtime_dir"
          }
          trap cleanup EXIT
          chmod 700 "$keyring_home" "$runtime_dir"

          HOME="$keyring_home" XDG_RUNTIME_DIR="$runtime_dir" \
            dbus-run-session -- bash -euo pipefail -c '
              # The ephemeral password is piped to gnome-keyring and never
              # appears in argv, the environment, or the Actions log.
              od -An -N32 -tx1 /dev/urandom |
                tr -d "[:space:]" |
                gnome-keyring-daemon --unlock --components=secrets >/dev/null
              npm run test:linux-secret-service
            '
