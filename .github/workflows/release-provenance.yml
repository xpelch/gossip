name: Release provenance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Build and attest the package
        run: >-
          npm run release:provenance --
          --output "$RUNNER_TEMP/gossip-release-provenance.json"
          --artifact "$RUNNER_TEMP/gossip-agent-kit.tgz"

      - name: Verify the provenance against the checkout and artifact
        run: >-
          npm run verify:release-provenance --
          --manifest "$RUNNER_TEMP/gossip-release-provenance.json"
          --artifact "$RUNNER_TEMP/gossip-agent-kit.tgz"

      - name: Attest the package to this public repository and workflow
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gossip-agent-kit.tgz

      - name: Upload the reviewable provenance bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gossip-release-provenance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gossip-release-provenance.json
            ${{ runner.temp }}/gossip-agent-kit.tgz
          if-no-files-found: error
